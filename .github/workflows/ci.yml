name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    # macos-15's default Xcode is 16.x (Swift 6): required for Swift Testing,
    # which does not exist in macos-14's default Swift 5.10 toolchain.
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      # actions/checkout v4.2.2, pinned so CI does not execute a mutable tag.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Show toolchain
        run: swift --version

      - name: Verify local-runtime lock integrity
        # Searched by directory, not by file: the pin moved to
        # LocalRuntimeInstaller when the two offline voices started sharing one
        # venv and one lock, and a check keyed to a file path fails loudly on a
        # rename when it should be checking the invariant instead.
        run: |
          lock_hash="$(shasum -a 256 daemon/requirements.lock | cut -d ' ' -f 1)"
          if ! grep -rq "$lock_hash" Sources/SRCore/; then
            echo "daemon/requirements.lock hashes to $lock_hash, which no" >&2
            echo "compiled-in pin under Sources/SRCore matches. Update" >&2
            echo "LocalRuntimeInstaller.requirementsLockSHA256." >&2
            exit 1
          fi

      - name: Test
        run: make test

      - name: Build
        run: make build

      - name: Check packaging and daemon syntax
        run: |
          bash -n scripts/build-app.sh
          bash -n scripts/setup-signing.sh
          python3 -m py_compile daemon/sr_tts_server.py daemon/sr_f5_fetch.py
